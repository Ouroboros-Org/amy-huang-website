# Template manifest. `dna cleanup` applies it and `dna check-template` verifies it.

# "template" in dna-template itself; `dna cleanup` changes it to "project".
state = "project"
version = "0.0.1"
source = "https://github.com/Marc-Paul/dna-template"

# Paths that come from dna-template. Improve them upstream and bring the change back,
# so projects keep a common process. Everything else belongs to the project.
owned = [
  "dna/__init__.py",
  "dna/__main__.py",
  "dna/check.py",
  "dna/config.py",
  "dna/doctor.py",
  "dna/gh.py",
  "dna/merge.py",
  "dna/setup.py",
  "dna/wiki.py",
  "dna/process.toml",
  "dna/template.toml",
  ".github/workflows/routines.yml",
  ".github/pull_request_template.md",
  ".github/ISSUE_TEMPLATE/outcome.md",
  "CONTRIBUTING.md",
  "AGENTS.md",
  "wiki/Acceptance-and-delivery.md",
  "wiki/Glossary.md",
  "wiki/Information-homes.md",
  "wiki/Process-tools.md",
  "wiki/Project-planning.md",
  "wiki/Triage-and-refinement.md",
  "wiki/Verification-and-review.md",
  "wiki/Wiki-maintenance.md",
]

[cleanup]
# Each key is replaced by the file named as its value, with {{...}} values filled.
replace = { "README.md" = "dna/seed/README.md" }
# Removed after the replacements.
remove = ["dna/seed"]
