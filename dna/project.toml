# The project's own decisions. Fill the {{...}} values before running `python3 -m dna setup`.
# Project-owned: change it whenever a decision changes.

[project]
name = "{{project name}}"
description = "{{one sentence on what the project is for}}"

[planning]
# Horizon milestones, from soon to some time: soon, after, later, some time.
horizons = ["0.0.1", "0.0.2", "0.1.x", "1.x.x"]
# The planning Project. An empty title means "<project name> planning".
project_title = ""

[repository]
# "squash" or "merge". `dna merge` uses it, and setup allows only this method.
merge_method = "squash"

[wiki]
# "auto" uses the repository's GitHub Wiki when its Git repository is reachable,
# otherwise the wiki/ folder. "native" or "folder" fixes the choice.
mode = "auto"

[routines]
# Kept-open Issues without an update for this many days appear in the triage report.
kept_open_review_days = 30
# The routine cadence is the schedule in .github/workflows/routines.yml.

# Project checks for `dna check`. A check runs when one of its paths changed,
# or always when it has no paths. Globs follow Python fnmatch: "*" also matches "/".
#
# [[checks]]
# name = "unit tests"
# paths = ["src/*", "tests/*"]
# run = "make test"
